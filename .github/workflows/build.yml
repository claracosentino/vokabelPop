name: Build Vokabel-Pop.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyinstaller==6.22.3 pywebview==6.2.1 pythonnet==3.2.0

      - name: Test logic
        run: python -I test_core.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name Vokabel-Pop
          --distpath dist
          --add-data "vocab.json;."
          --add-data "control.html;." --add-data "control.css;." --add-data "control.js;."
          --add-data "banner.html;." --add-data "banner.css;." --add-data "banner.js;."
          --add-data "style.css;." --add-data "speak.js;."
          --collect-all webview --collect-all pythonnet
          app.py

      - name: Check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Vokabel-Pop.exe)) { Write-Error "Vokabel-Pop.exe non trovato"; exit 1 }
          "{0:N1} MB" -f ((Get-Item dist/Vokabel-Pop.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Vokabel-Pop-exe
          path: dist/Vokabel-Pop.exe
          if-no-files-found: error
          retention-days: 30
